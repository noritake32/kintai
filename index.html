<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="香月農園 勤怠">
  <meta name="theme-color" content="#2c7be5">
  <title>香月農園 勤怠打刻</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html,body{margin:0;height:100%;background:#f2f4f7;overflow:hidden;
              -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
    /* GASアプリを全画面で読み込む枠 */
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;}
    /* 読み込み中の表示 */
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
            background:#f2f4f7;color:#8a94a6;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
            transition:opacity .3s;z-index:2;}
    #splash img{width:84px;height:84px;border-radius:20px;margin-bottom:14px;}
    #splash .t{font-size:14px;}
    .spin{width:26px;height:26px;border:3px solid #d6dbe3;border-top-color:#2c7be5;border-radius:50%;
          margin-top:14px;animation:sp 1s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}
  </style>
</head>
<body>

  <!-- 読み込み中スプラッシュ -->
  <div id="splash">
    <img src="icon-192.png" alt="">
    <div class="t">香月農園 勤怠打刻</div>
    <div class="spin"></div>
  </div>

  <!--
    ▼▼▼ ここをあなたのGAS公開URL（…/exec）に書き換えてください ▼▼▼
    例: https://script.google.com/macros/s/AKfy............/exec
  -->
  <iframe id="app"
          src="https://script.google.com/macros/s/AKfycbyGLx0B_3rOf-cnnyu3T0S1UUsBz3XsSGPrBGUW8RJb9okHkPInUsz_RRFTljJNY6Oj/exec"
          allow="camera; microphone; geolocation; fullscreen; clipboard-write"
          allowfullscreen></iframe>

  <script>
    // iframeの読み込みが終わったらスプラッシュを消す
    var ifr = document.getElementById('app');
    var splash = document.getElementById('splash');
    function hideSplash(){ if(!splash) return; splash.style.opacity='0'; setTimeout(function(){ splash.style.display='none'; }, 320); }
    ifr.addEventListener('load', hideSplash);
    setTimeout(hideSplash, 6000); // 保険（onloadが来なくても消す）

    // Service Worker 登録（ホーム追加でアプリ化）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
